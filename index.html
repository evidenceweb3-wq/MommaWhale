<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Momma Whale 🐳</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  min-height: 100vh;
  background: url("https://i.postimg.cc/hvP8Wf9R/marveon.gif") center / cover no-repeat fixed;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #eaf6ff;
  overflow: hidden;
}

/* RANDOM FLOATING WHALES */
.bg-whale {
  position: absolute;
  font-size: 2.4rem;
  opacity: 0.18;
  animation: drift 30s ease-in-out infinite alternate;
  pointer-events: none;
}

@keyframes drift {
  0% { transform: translate(0,0) rotate(0deg); }
  50% { transform: translate(35px, -40px) rotate(6deg); }
  100% { transform: translate(-25px, 35px) rotate(-6deg); }
}

/* Card */
.card {
  position: relative;
  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.08),
    rgba(0,30,70,0.7)
  );
  backdrop-filter: blur(12px);
  padding: 54px 26px 34px;
  border-radius: 30px;
  max-width: 520px;
  width: 94%;
  text-align: center;
  box-shadow:
    0 30px 60px rgba(0,0,0,0.6),
    inset 0 1px 0 rgba(255,255,255,0.15);
}

/* Badge */
.badge {
  position: absolute;
  top: -36px;
  right: -36px;
  width: 112px;
  height: 112px;
  border-radius: 22px;
  overflow: hidden;
  box-shadow:
    0 18px 40px rgba(0,0,0,0.6),
    0 0 22px rgba(120,180,255,0.45);
  transition: transform .25s ease;
}
.badge:hover { transform: scale(1.08) rotate(-2deg); }
.badge img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Logo */
.logo {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
}
.logo .mom {
  font-size: 3.6rem;
  filter: drop-shadow(0 0 10px #6ecbff);
}
.logo .baby {
  font-size: 1.8rem;
  transform: scaleX(-1);
  opacity: .9;
}

/* Title */
h1 {
  margin-top: 10px;
  font-size: clamp(2.1rem, 5vw, 2.7rem);
  color: #dff4ff;
  animation: glow 4s ease-in-out infinite;
}

@keyframes glow {
  0%,100% {
    text-shadow:
      0 0 6px rgba(120,190,255,0.6),
      0 0 18px rgba(80,160,255,0.5);
  }
  50% {
    text-shadow:
      0 0 12px rgba(120,200,255,0.9),
      0 0 32px rgba(80,160,255,0.8);
  }
}

/* Subtitle */
.subtitle {
  margin-top: 10px;
  font-weight: 800;
  font-size: clamp(0.85rem, 2.8vw, 1rem);
  white-space: nowrap;
  opacity: 0.96;
}

/* Stats */
.stats {
  margin-top: 22px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.stat {
  background: rgba(255,255,255,0.18);
  border-radius: 16px;
  padding: 12px 6px;
  transition: box-shadow .25s ease;
}
.stat:hover {
  box-shadow: 0 0 18px rgba(110,190,255,0.45);
}

.stat-label {
  font-size: 0.65rem;
  letter-spacing: 1px;
  opacity: 0.75;
}

.stat-value {
  margin-top: 4px;
  font-weight: 700;
  font-size: 0.9rem;
}

.green { color: #7dffb3; }
.red { color: #ff9a9a; }

/* Contract */
.ca-box {
  margin-top: 20px;
  background: rgba(255,255,255,0.18);
  padding: 16px;
  border-radius: 18px;
  border: 1px solid rgba(120,200,255,0.35);
  transition: box-shadow .25s ease;
}
.ca-box:hover {
  box-shadow: 0 0 22px rgba(120,190,255,0.4);
}

.label {
  font-size: 0.65rem;
  letter-spacing: 1.2px;
  opacity: 0.75;
  margin-bottom: 8px;
}

.ca {
  font-weight: 800;
  font-size: clamp(0.7rem, 2.6vw, 0.9rem);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}

.copied {
  margin-top: 8px;
  font-size: 0.7rem;
  color: #b9e6ff;
  opacity: 0;
  transition: opacity .3s ease;
}

/* Button */
.dex-btn {
  margin-top: 22px;
  display: inline-block;
  padding: 13px 26px;
  border-radius: 999px;
  background: linear-gradient(135deg, #4fb4ff, #1c7ed6);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
  box-shadow: 0 10px 25px rgba(0,0,0,0.35);
  transition: transform .2s ease, box-shadow .2s ease;
}
.dex-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 14px 30px rgba(0,0,0,0.45);
}

@media (max-width: 420px) {
  .badge {
    width: 92px;
    height: 92px;
    top: -30px;
    right: -30px;
  }
}
</style>
</head>

<body>

<!-- RANDOM BACKGROUND WHALES -->
<div class="bg-whale" style="top:8%;left:6%;animation-duration:42s;">🐳</div>
<div class="bg-whale" style="top:22%;left:72%;animation-duration:38s;font-size:2.1rem;">🐋</div>
<div class="bg-whale" style="top:55%;left:12%;animation-duration:50s;">🐳</div>
<div class="bg-whale" style="top:70%;left:80%;animation-duration:44s;font-size:2.8rem;">🐋</div>
<div class="bg-whale" style="top:38%;left:45%;animation-duration:60s;opacity:.14;">🐳</div>
<div class="bg-whale" style="top:82%;left:30%;animation-duration:52s;font-size:1.9rem;">🐋</div>

<div class="card">

  <a class="badge" href="https://jumpshare.com/s/zKswjFuwoQg2Jtj8vQN7" target="_blank">
    <img src="https://i.postimg.cc/sDJP07qT/Chat-GPT-Image-5-ene-2026-21-44-09-(1).png">
  </a>

  <div class="logo">
    <span class="mom">🐳</span>
    <span class="baby">🐋</span>
  </div>

  <h1>The Momma Whale</h1>

  <div class="subtitle">
    Big heart. Deep waters. A gentle giant of the meme ocean.
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">PRICE</div><div id="price" class="stat-value">—</div></div>
    <div class="stat"><div class="stat-label">24H</div><div id="change" class="stat-value">—</div></div>
    <div class="stat"><div class="stat-label">MCAP</div><div id="mcap" class="stat-value">—</div></div>
  </div>

  <div class="ca-box">
    <div class="label">CONTRACT ADDRESS</div>
    <div class="ca" id="ca">7TBD7QD9kyzwADErHusNtVWzSBdtG8j4aYJuXadNpump</div>
    <div class="copied" id="copied">🐳 Copied!</div>
  </div>

  <a class="dex-btn" target="_blank"
     href="https://dexscreener.com/solana/7lwmacukivl9zkrzyjrdqer7iaugjyzsuevmxct9v4zk">
    🌊 View on Dexscreener
  </a>

</div>

<script>
const API = "https://api.dexscreener.com/latest/dex/pairs/solana/7LWmACukiVL9ZkrzYjrdQEr7iaugJyZsuEvMxct9V4Zk";

function formatMarketCap(v) {
  if (!v) return "—";
  if (v >= 1_000_000) return (v / 1_000_000).toFixed(2).replace(/\.00$/, "") + "M";
  if (v >= 1_000) return Math.round(v / 1_000) + "K";
  return "$" + v.toLocaleString();
}

async function loadStats() {
  const r = await fetch(API);
  const d = await r.json();
  const p = d.pairs[0];
  price.innerText = "$" + Number(p.priceUsd).toFixed(6);
  change.innerText = (p.priceChange.h24 > 0 ? "+" : "") + p.priceChange.h24 + "%";
  change.className = "stat-value " + (p.priceChange.h24 >= 0 ? "green" : "red");
  mcap.innerText = formatMarketCap(p.fdv);
}

loadStats();
setInterval(loadStats, 30000);

ca.onclick = () => {
  navigator.clipboard.writeText(ca.innerText.trim());
  copied.style.opacity = 1;
  setTimeout(() => copied.style.opacity = 0, 1600);
};
</script>

</body>
</html>
