<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Momma Whale 🐳</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  cursor: url("https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f433.png") 16 16, auto;
  min-height: 100vh;
  background:
    linear-gradient(rgba(0,70,140,0.5), rgba(0,70,140,0.5)),
    url("https://i.postimg.cc/hvP8Wf9R/marveon.gif");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #eaf6ff;
  overflow: hidden;
}

/* Floating whales */
.whale {
  position: absolute;
  font-size: 3rem;
  opacity: 0.25;
  animation: float 16s infinite ease-in-out;
}
.whale.w1 { top: 10%; left: 6%; animation-duration: 18s; }
.whale.w2 { bottom: 18%; right: 8%; animation-duration: 22s; }
.whale.w3 { top: 42%; right: 18%; animation-duration: 15s; }

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
  100% { transform: translateY(0); }
}

.card {
  background: rgba(0, 30, 70, 0.6);
  backdrop-filter: blur(9px);
  padding: 32px 24px;
  border-radius: 24px;
  max-width: 460px;
  width: 92%;
  text-align: center;
  box-shadow: 0 25px 50px rgba(0,0,0,0.4);
}

.logo {
  font-size: 3.4rem;
}

h1 {
  font-size: 2.3rem;
  margin-top: 6px;
}

p {
  margin-top: 12px;
  font-size: 1rem;
  opacity: 0.95;
}

.ca-box {
  margin-top: 20px;
  background: rgba(255,255,255,0.14);
  padding: 14px;
  border-radius: 14px;
  font-size: 0.8rem;
}

.label {
  font-size: 0.65rem;
  letter-spacing: 1.2px;
  opacity: 0.75;
  margin-bottom: 6px;
}

.ca {
  white-space: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}
.ca::-webkit-scrollbar { display: none; }

/* DEX Button */
.dex-btn {
  margin-top: 18px;
  display: inline-block;
  padding: 12px 22px;
  border-radius: 999px;
  background: linear-gradient(135deg, #4fb4ff, #1c7ed6);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
  box-shadow: 0 10px 25px rgba(0,0,0,0.35);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.dex-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 15px 30px rgba(0,0,0,0.45);
}

footer {
  margin-top: 18px;
  font-size: 0.75rem;
  opacity: 0.85;
}

footer a {
  color: #a8d8ff;
  text-decoration: none;
}

footer a:hover {
  text-decoration: underline;
}

@media (min-width: 768px) {
  h1 { font-size: 2.6rem; }
}
</style>
</head>

<body>

<!-- Floating whales -->
<div class="whale w1">🐳</div>
<div class="whale w2">🐋</div>
<div class="whale w3">🐳</div>

<div class="card">
  <div class="logo">🐳</div>
  <h1>The Momma Whale</h1>

  <p>
    Big heart. Deep waters.<br>
    A true whale of the meme ocean.
  </p>

  <div class="ca-box">
    <div class="label">CONTRACT ADDRESS</div>
    <div class="ca">
      7TBD7QD9kyzwADErHusNtVWzSBdtG8j4aYJuXadNpump
    </div>
  </div>

  <a
    class="dex-btn"
    href="https://dexscreener.com/solana/7lwmacukivl9zkrzyjrdqer7iaugjyzsuevmxct9v4zk"
    target="_blank"
  >
    🌊 View on Dexscreener
  </a>

  <footer>
    <a
      href="https://dexscreener.com/solana/7lwmacukivl9zkrzyjrdqer7iaugjyzsuevmxct9v4zk"
      target="_blank"
    >
      dexscreener.com
    </a>
  </footer>
</div>

</body>
</html>
